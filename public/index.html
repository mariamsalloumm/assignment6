<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rose Notes · Mariam Salloum</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div class="brand">✿ &nbsp; ROSE NOTES</div><span>Mariam Salloum · My workspace</span></header>
<section class="intro"><p class="eyebrow">A LITTLE SPACE FOR BIG IDEAS</p><h1>Make room for<br><em>your thoughts.</em></h1><p>Study plans, bright ideas, and everything in between.</p></section>
<div class="layout"><section class="editor panel"><p class="eyebrow">CAPTURE SOMETHING GOOD</p><h2 id="editor-title">A fresh note</h2><form id="note-form"><label for="title">Title</label><input id="title" maxlength="120" placeholder="Give your idea a name" required><label for="content">Your note</label><textarea id="content" maxlength="10000" rows="8" placeholder="Start writing here…" required></textarea><div class="actions"><button id="save" type="submit">Save note <span>↗</span></button><button id="cancel" type="button" class="secondary" hidden>Cancel edit</button></div></form><p id="status" role="status" aria-live="polite"></p></section>
<section class="collection"><div class="collection-head"><h2>Your collection <span id="count">0</span></h2><button class="secondary" id="refresh" type="button">Refresh</button></div><label class="sr-only" for="search">Search notes</label><input id="search" type="search" placeholder="Search your notes…"><div id="notes" aria-live="polite"></div></section></div><footer>Rose Notes &nbsp; / &nbsp; A thought today. A possibility tomorrow.</footer></main></body></html>
